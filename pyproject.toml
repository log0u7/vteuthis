[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vteuthis"
version = "0.0.0"
description = "Vampyroteuthis infernalis: an agent that earns its own inference or dies."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "temporalio>=1.7",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=2",
    "psycopg[binary,pool]>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
vteuthis = "vteuthis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "db: requires postgres (vteuthis_test)",
    "docker: requires a running docker daemon",
]